[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-rescue"
version = "0.1.0"
description = "A corpus-grounded agentic recipe recommendation application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph",
  "openai>=3.31,<4",
  "pandas",
  "Pillow>=10,<13",
  "pyarrow",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "PyYAML",
  "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
