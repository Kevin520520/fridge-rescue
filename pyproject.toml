[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-rescue"
version = "0.1.0"
description = "A retrieval-augmented agentic recipe recommender"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph==1.2.15",
  "openai==3.31.0",
  "pyarrow==26.0.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "python-dotenv==1.2.4",
  "PyYAML==6.0.3",
  "streamlit==1.66.0",
]

[project.optional-dependencies]
data = [
  "kagglehub==1.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
