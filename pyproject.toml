[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-rescue"
version = "0.1.0"
description = "A retrieval-augmented agentic recipe recommendation course project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph",
  "openai>=3.31,<4",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "PyYAML",
  "streamlit",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
