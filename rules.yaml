# Substitution rules apply only to the listed contexts and retain their warnings.
substitutions:
  butter:
    substitute: olive oil
    allowed_contexts:
      - saute
      - pan fry
    warning: Not guaranteed to work for baking.
  milk:
    substitute: unsweetened soy milk
    allowed_contexts:
      - soup
      - sauce
    warning: Check allergy requirements and flavour compatibility.
  egg:
    substitute: flax egg
    allowed_contexts:
      - binding
    warning: Not a general replacement for omelettes or egg-based dishes.

