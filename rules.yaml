    - oven
    - bake
    - baked
    - roast
    - roasted
  microwave:
    - microwave
  blender_or_food_processor:
    - blender
    - food processor
  slow_cooker:
    - slow cooker
    - crock pot
    - crockpot
  grill:
    - grill
    - grilled
  waffle_iron:
    - waffle iron

# Compound phrases that name cookware rather than the appliance itself.
# They are masked only for the matching equipment tag; an explicit "bake" or
# second "oven" elsewhere in the text still produces the oven tag.
equipment_exclusion_phrases:
  oven:
    - dutch oven
    - bake in waffle iron
    - bake in a waffle iron
    - bake in hot waffle iron
    - bake in a hot waffle iron
  blender_or_food_processor:
    - pastry blender
    - if you have a food processor

# High-precision scope filters used only during corpus curation. Bare words
# such as "dog", "cat" and "pet" are intentionally omitted to protect valid
# recipes such as hot dogs and catfish.
scope_exclusion_markers:
  pet_food:
    - for dogs
    - for cats
    - dog food
    - dog treats
    - dog biscuits
    - dog cookies
    - cat food
    - cat treats
    - cat biscuits
    - cat cookies
    - pet food
    - pet treats
    - puppy treats
    - kitten treats
    - canine feeding
    - feline feeding
  non_food:
    - face mask
    - facial mask
    - facial scrub
    - facial cleanser
    - body scrub
    - bath salts
    - household cleaner
    - foot remedy
    - stinky feet
    - insect bite remedy
    - play dough
    - playdough
    - surprise toy

