pantry_staples:
  - water
  - salt
  - black pepper
  - cooking oil

# Curation v3 uses the source's complete ingredient lines. A line is retained
# exactly as published; quantities or units are never reconstructed or guessed.
curation:
  minimum_ingredients: 3
  minimum_instructions: 2
  minimum_measurement_coverage: 0.60

