pantry_staples:
  - water
  - salt
  - black pepper
  - cooking oil

# A selected recipe must have at least two independent Food.com reviews. This
# conservative evidence threshold reduces untested or incomplete source records;
# it is a curation criterion, not a claim that reviewed recipes are error-free.
curation:
  minimum_review_count: 2

