equipment_keywords:
  oven:
    - oven
    - bake
    - baked
    - roast
    - roasted
  microwave:
    - microwave
  blender_or_food_processor:
    - blender
    - food processor
  slow_cooker:
    - slow cooker
    - crock pot
    - crockpot
  grill:
    - grill
    - grilled
  waffle_iron:
    - waffle iron

# Compound phrases that name cookware rather than the appliance itself.
# They are masked only for the matching equipment tag; an explicit "bake" or
# second "oven" elsewhere in the text still produces the oven tag.
equipment_exclusion_phrases:
  oven:
    - dutch oven
    - bake in waffle iron
    - bake in a waffle iron
    - bake in hot waffle iron
    - bake in a hot waffle iron
  blender_or_food_processor:
    - pastry blender
    - if you have a food processor

# High-precision scope filters used only during corpus curation. Bare words
# such as "dog", "cat" and "pet" are intentionally omitted to protect valid
# recipes such as hot dogs and catfish.
scope_exclusion_markers:
  pet_food:
    - for dogs
    - for cats
    - dog food
    - dog treats
    - dog biscuits
    - dog cookies
    - cat food
    - cat treats
    - cat biscuits
    - cat cookies
    - pet food
    - pet treats
    - puppy treats
    - kitten treats
    - canine feeding
    - feline feeding
  non_food:
    - face mask
    - facial mask
    - body scrub
    - bath salts
    - household cleaner

# Source defects confirmed against both the raw row and the curated record by
# frozen Curation v1/v2 AI-assisted audits. These records cannot be repaired
# without inventing ingredients or other source facts.
reviewed_source_exclusions:
  "398552": missing_required_chocolate
  "150396": missing_required_horseradish
  "368682": ingredient_instruction_stock_conflict
  "529699": missing_required_lard_and_butter
  "444767": duplicate_ingredient_hides_required_oil
  "275695": missing_defining_cooking_steps
  "526383": missing_required_jalapeno
  "135340": missing_required_yogurt
  "107856": conflicting_sweetener_product
  "119810": missing_required_whipped_cream
  "266782": declared_total_time_omits_sequential_cooking
  "416910": declared_total_time_omits_required_resting
  "75644": missing_required_frying_fat
  "42520": missing_required_grape_juice_or_fruit_nectar

